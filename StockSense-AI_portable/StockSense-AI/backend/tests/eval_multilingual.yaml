# Multilingual evaluation: Hindi (hi) and Telugu (te) versions of questions from eval_cases.yaml.
# `like: <id>` reuses that case's hand-written reference SQL, so a non-English question must return the SAME data as
# its English twin. `lang` also checks that the final reply is written in that language's script.
# Run: python tests/run_eval.py --file eval_multilingual.yaml

# ---- Hindi
- {id: HI01, like: S01, lang: hi, cat: sales, expect: sql, q: "अक्टूबर 2026 में कुल राजस्व कितना है?"}
